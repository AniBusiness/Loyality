name = "loyalty-perks"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"   # yourdomain.com/store1 -> index.html
run_worker_first = ["/api/*"]                     # the Worker only runs for API calls

[[d1_databases]]
binding = "DB"
database_name = "loyalty"
database_id = "PASTE-ID-FROM-d1-create"

